{% extends "base.html" %}{% block content %}<h1>Customers</h1><div class="grid"><section class="card"><h2>Add customer</h2><form method="post"><label>Name</label><input name="name" required><label>Email</label><input name="email" type="email"><label>Mobile</label><input name="mobile"><label>City</label><input name="city"><label>Status</label><select name="status"><option>Active</option><option>Inactive</option></select><button>Add customer</button></form></section><section class="card"><h2>Customer list</h2><form><input name="q" placeholder="Search by name"><button>Search</button></form><div class="tablewrap"><table><tr><th>Name</th><th>Email</th><th>Mobile</th><th>City</th><th>Status</th></tr>{% for c in customers %}<tr><td>{{ c.name }}</td><td>{{ c.email }}</td><td>{{ c.mobile }}</td><td>{{ c.city }}</td><td>{{ c.status }}</td></tr>{% endfor %}</table></div></section></div>{% endblock %}
