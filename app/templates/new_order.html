{% extends "base.html" %}{% block content %}<h1>Create Sales Order</h1><section class="card"><form method="post" id="order-form"><label>Customer</label><select name="customer_id" required>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select><div class="heading"><h2>Order items</h2><button type="button" class="secondary" id="add-row">Add product +</button></div><div id="items">
<div class="item-row"><select name="product_id[]" class="product-select" required><option value="">Choose product</option>{% for p in products %}<option value="{{ p.id }}" data-price="{{ p.price }}" data-stock="{{ p.stock_quantity }}">{{ p.name }} (₹{{ p.price }}, stock {{ p.stock_quantity }})</option>{% endfor %}</select><input name="quantity[]" type="number" min="1" value="1" class="qty" required><span class="line-total">₹0.00</span><button type="button" class="remove-row secondary">Remove</button></div></div>
<label>Discount % (0–20)</label><input name="discount_percentage" id="discount" type="number" min="0" max="20" step=".01" value="0"><div class="totals"><p>Subtotal: <strong id="subtotal">₹0.00</strong></p><p>Discount: <strong id="discount-amount">₹0.00</strong></p><h2>Grand total: <strong id="grand-total">₹0.00</strong></h2></div><button type="submit">Save draft order</button></form></section>{% endblock %}
