{% extends "base.html" %}{% block content %}<h1>Products & Inventory</h1><div class="grid"><section class="card"><h2>Add product</h2><form method="post"><label>Product code</label><input name="product_code" required><label>Name</label><input name="name" required><label>Category</label><input name="category" required><label>Price</label><input name="price" type="number" min="0" step=".01" required><label>Opening stock</label><input name="stock_quantity" type="number" min="0" required><label>Status</label><select name="status"><option>Active</option><option>Inactive</option></select><button>Add product</button></form></section><section class="card"><h2>Product list</h2><form><input name="q" placeholder="Search code or name"><button>Search</button></form><div class="tablewrap"><table><tr><th>Code</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th></tr>{% for p in products %}<tr><td>{{ p.product_code }}</td><td>{{ p.name }}</td><td>{{ p.category }}</td><td>₹{{ p.price }}</td><td>{{ p.stock_quantity }}</td><td>{{ p.status }}</td></tr>{% endfor %}</table></div></section></div>
<section class="card"><h2>Adjust stock</h2><form method="post" action="{{ url_for('master.stock_adjust') }}"><label>Product</label><select name="product_id">{% for p in products %}<option value="{{ p.id }}">{{ p.product_code }} — {{ p.name }}</option>{% endfor %}</select><label>Quantity change (use negative to decrease)</label><input name="quantity_change" type="number" required><label>Reason</label><input name="reason" required><button>Save adjustment</button></form></section>{% endblock %}
